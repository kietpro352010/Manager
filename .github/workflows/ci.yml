name: Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node 20 Syntax, Unit & Real PostgreSQL 16 Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pg_ci_password
          POSTGRES_DB: manager_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d manager_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (src/**/*.js & tests/*.js)
        run: find src tests -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Run full manager test suite
        run: npm test

      - name: Run real PostgreSQL 16 integration & concurrency suite
        env:
          DATABASE_URL: postgres://postgres:pg_ci_password@127.0.0.1:5432/manager_ci
        run: node tests/postgres-real.test.js
