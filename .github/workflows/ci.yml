name: Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: find src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Run unit tests
        run: node --test test/*.test.js

      - name: Run E2E suites
        run: node test/e2e/runner.js --all
