name: Manager CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node 20 Syntax & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (src/**/*.js & tests/*.js)
        run: find src tests -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Run integration tests
        run: node tests/integration.test.js

      - name: Run services wiring tests
        run: node tests/services-wiring.test.js

      - name: Run storage SQL tests (if present)
        run: |
          if [ -f tests/storage-sql.test.js ]; then
            node tests/storage-sql.test.js
          else
            echo "tests/storage-sql.test.js not present; skipping."
          fi
