name: Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout Manager repository
        uses: actions/checkout@v4
        with:
          path: manager

      - name: Checkout sibling BotWorker repository
        uses: actions/checkout@v4
        with:
          repository: kietpro352010/BotWorker
          ref: main
          path: worker

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            manager/package-lock.json
            worker/package-lock.json

      - name: Install Manager dependencies
        working-directory: manager
        run: npm ci

      - name: Install BotWorker dependencies
        working-directory: worker
        run: npm ci

      - name: Syntax check all source files
        working-directory: manager
        run: find src -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Run unit tests
        working-directory: manager
        env:
          WORKER_DIR: ${{ github.workspace }}/worker
        run: node --test --test-timeout=60000 test/*.test.js

      - name: Run E2E suites
        working-directory: manager
        env:
          WORKER_DIR: ${{ github.workspace }}/worker
        run: node test/e2e/runner.js --all
