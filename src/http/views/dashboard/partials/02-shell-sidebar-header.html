<div id="mainApp" class="app">

            <path d="M21 7l-9 5-9-5"/>

        </div>
        <div class="sidebar-brand-text">
          <span class="sidebar-brand-name">KBOT Manager</span>
          <span class="sidebar-brand-sub">V12.1.1 ENTERPRISE</span>
        </div>
      </div>
      <button type="button" id="sidebarCollapseBtn" class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" aria-label="Thu gọn hoặc mở rộng thanh bên" title="Thu gọn thanh bên">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button type="button" class="sidebar-mobile-close-btn" onclick="closeMobileSidebar()" aria-label="Đóng menu điều hướng">✕</button>

    <div class="sidebar-nav-section">
      <div class="sidebar-section-label">Điều hành</div>

        <span class="sidebar-nav-label">Tổng quan Bot</span>
      </button>
    </div>

    <div class="sidebar-nav-section admin-only">

      <button type="button" class="sidebar-nav-btn admin-only" data-sidebar-page="users" data-tooltip="Người dùng & Key" onclick="navigateTo('users'); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="sidebar-nav-label">Người dùng &amp; Key</span>
      </button>
      <button type="button" class="sidebar-nav-btn admin-only" data-sidebar-page="audit" data-tooltip="Nhật ký Audit" onclick="navigateTo('audit'); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span class="sidebar-nav-label">Nhật ký Audit</span>
      </button>
      <button type="button" class="sidebar-nav-btn admin-only" data-sidebar-page="backup" data-tooltip="Sao lưu & Khôi phục" onclick="navigateTo('backup'); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span class="sidebar-nav-label">Sao lưu &amp; Dữ liệu</span>
      </button>
      <button type="button" class="sidebar-nav-btn admin-only" data-tooltip="Supabase Cloud" onclick="openSupabaseModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
        <span class="sidebar-nav-label">Supabase Cloud</span>
      </button>
      <button type="button" class="sidebar-nav-btn admin-only" data-tooltip="Mật khẩu Bot" onclick="openAdminModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <span class="sidebar-nav-label">Mật khẩu Bot</span>
      </button>
      <button type="button" class="sidebar-nav-btn admin-only" data-tooltip="Thông báo & Webhook" onclick="openAnnouncementAdminModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="sidebar-nav-label">Thông báo Popup</span>
      </button>
    </div>

    <div class="sidebar-nav-section">
      <div class="sidebar-section-label">Tài khoản &amp; Hỗ trợ</div>
      <button type="button" id="sidebarRedeemKeyBtn" class="sidebar-nav-btn user-only" data-tooltip="Nhập mã Key" onclick="openRenewModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        <span class="sidebar-nav-label">Nhập mã Key</span>
      </button>
      <button type="button" class="sidebar-nav-btn" data-tooltip="Liên kết Discord" onclick="openDiscordLinkModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="sidebar-nav-label">Liên kết Discord</span>
      </button>
      <button type="button" class="sidebar-nav-btn" data-tooltip="Đổi mật khẩu" onclick="openChangePasswordModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span class="sidebar-nav-label">Đổi mật khẩu</span>
      </button>
      <button type="button" class="sidebar-nav-btn" data-tooltip="Lịch sử cập nhật" onclick="openChangelogModal(); closeMobileSidebar();">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="sidebar-nav-label">Lịch sử cập nhật</span>
      </button>
      <button type="button" class="sidebar-nav-btn" data-tooltip="Đăng xuất" onclick="logout()">
        <svg class="sb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="sidebar-nav-label">Đăng xuất</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-theme-box">
        <div class="sidebar-section-label" style="padding-left:2px;">Giao diện</div>
        <div class="sidebar-theme-grid" role="group" aria-label="Chọn giao diện">
          <button type="button" class="sidebar-theme-btn active" data-theme-choice="deep-galaxy" onclick="applyDashboardCosmicMode('deep-galaxy')">
            <span>Deep Galaxy</span>
            <span class="theme-swatch-dot" style="background:#7c5cf6;"></span>
          </button>
          <button type="button" class="sidebar-theme-btn" data-theme-choice="ocean-abyss" onclick="applyDashboardCosmicMode('ocean-abyss')">
            <span>Ocean Abyss</span>
            <span class="theme-swatch-dot" style="background:#0ea5e9;"></span>
          </button>
          <button type="button" class="sidebar-theme-btn" data-theme-choice="violet-dusk" onclick="applyDashboardCosmicMode('violet-dusk')">
            <span>Violet Dusk</span>
            <span class="theme-swatch-dot" style="background:#4c3f7a;"></span>
          </button>
          <button type="button" class="sidebar-theme-btn" data-theme-choice="moonlight" onclick="applyDashboardCosmicMode('moonlight')">
            <span>Moonlight</span>
            <span class="theme-swatch-dot" style="background:#f3f5f9;border:1px solid #94a3b8;"></span>
          </button>
        </div>
        <button type="button" id="bgEffectsToggleBtn" class="sidebar-theme-btn" style="width:100%;margin-top:4px;justify-content:center;" aria-pressed="false" onclick="toggleDashboardBgEffects()">Tắt hiệu ứng nền</button>
      </div>
    </div>
  </aside>

  <div class="app-main-column">
  <!-- GLOBAL TOP-RIGHT PINNED NAVIGATION HEADER -->
  <header id="globalHeader" class="global-header">
    <div class="global-header-left">
      <button type="button" id="sidebarToggleBtn" class="sidebar-mobile-toggle" onclick="toggleMobileSidebar()" aria-label="Mở menu điều hướng">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="global-header-brand" onclick="navigateTo('dashboard')">
        <span class="global-logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12"/><path d="M21 7l-9 5-9-5"/></svg>
        </span>
        <span class="global-brand-text">KBOT</span>
        <span class="vip-pill-mini">V12.1.1 PRO</span>
      </div>
      <nav class="global-nav-pills">
        <button type="button" class="nav-pill-btn active" id="navPillHome" onclick="navigateTo('dashboard')">
          Dashboard
        </button>

          Người dùng &amp; Key
        </button>
        <button type="button" class="nav-pill-btn admin-only" id="navPillAudit" onclick="navigateTo('audit')">
          Nhật ký Audit
        </button>
        <button type="button" class="nav-pill-btn admin-only" id="navPillBackup" onclick="navigateTo('backup')">
          Sao lưu
        </button>
        <button type="button" class="nav-pill-btn admin-only" id="navPillSupabase" onclick="openSupabaseModal()">
          Supabase Cloud
        </button>
      </nav>
    </div>
    <div class="global-header-right">
      <button type="button" id="btnOpenCommandPalette" class="cmd-palette-trigger-btn" onclick="openCommandPalette()" aria-label="Mở bảng tìm nhanh bot và lệnh điều khiển (Ctrl+K)" title="Tìm nhanh bot &amp; lệnh điều khiển (Ctrl+K hoặc /)">

        <span class="cmd-palette-trigger-label">Tìm nhanh...</span>
        <kbd class="cmd-palette-kbd" aria-hidden="true">Ctrl K</kbd>
      </button>
      <button type="button" id="cosmicModeToggleBtn" class="cosmic-toggle-pill" onclick="cycleDashboardCosmicMode()" title="Chuyển nhanh 4 giao diện: Deep Galaxy / Ocean Abyss / Violet Dusk / Moonlight">Deep Galaxy</button>

      <!-- ACCOUNT MENU BUTTON -->
      <div class="user-profile-menu-wrap" style="position:relative;">

            </button>

              <div class="profile-dropdown-expires" id="globalDropdownExpires" style="display:none;font-size:11px;color:var(--accent-text);margin-top:2px;font-weight:500;"></div>

          </div>
          <div class="profile-dropdown-divider"></div>

            <div class="profile-menu-section-title">Giao diện hiển thị</div>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:4px 8px 8px;">

              <button type="button" class="small" data-theme-choice="ocean-abyss" onclick="applyDashboardCosmicMode('ocean-abyss')">Ocean Abyss</button>
              <button type="button" class="small" data-theme-choice="violet-dusk" onclick="applyDashboardCosmicMode('violet-dusk')">Violet Dusk</button>
              <button type="button" class="small" data-theme-choice="moonlight" onclick="applyDashboardCosmicMode('moonlight')">Moonlight</button>
            </div>
            <div class="profile-dropdown-divider"></div>
            <div class="profile-menu-section-title">Chuyển trang nhanh</div>
            <button type="button" class="big-tab-item" onclick="navigateTo('dashboard'); closeGlobalProfileDropdown();">
              <span class="menu-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
              </span>
              <div class="menu-text">
                <strong>Dashboard</strong>
                <small>Xem và điều khiển danh sách bot</small>
              </div>
            </button>
            <button type="button" class="big-tab-item admin-only" onclick="navigateTo('users'); closeGlobalProfileDropdown();">
              <span class="menu-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              </span>
              <div class="menu-text">
                <strong>Người dùng &amp; Key</strong>
                <small>Cấp quyền, gia hạn và khóa tài khoản</small>
              </div>
            </button>
            <button type="button" class="big-tab-item admin-only" onclick="navigateTo('audit'); closeGlobalProfileDropdown();">
              <span class="menu-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </span>
              <div class="menu-text">
                <strong>Nhật ký Audit</strong>
                <small>Lịch sử thao tác và can thiệp hệ thống</small>
              </div>
            </button>
            <button type="button" class="big-tab-item admin-only" onclick="openSupabaseModal(); closeGlobalProfileDropdown();">
              <span class="menu-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
              </span>
              <div class="menu-text">
                <strong>Supabase Cloud</strong>
                <small>Lưu trữ bền vững và sao lưu đám mây</small>
              </div>
            </button>

            <div class="profile-dropdown-divider admin-only"></div>
            <div class="profile-menu-section-title admin-only">Tiện ích quản trị</div>
            <button type="button" class="profile-menu-item admin-only" onclick="openAnnouncementAdminModal(); closeGlobalProfileDropdown();">
              <span>Thông báo người dùng</span>
            </button>
            <button type="button" class="profile-menu-item admin-only" onclick="openBatchSettingsModal(); closeGlobalProfileDropdown();">
              <span>Đồng bộ cài đặt bot</span>
            </button>
            <button type="button" class="profile-menu-item admin-only" onclick="openAdminModal(); closeGlobalProfileDropdown();">
              <span>Mật khẩu Minecraft bot</span>
            </button>

            <div class="profile-dropdown-divider"></div>
            <button type="button" class="profile-menu-item" onclick="openChangePasswordModal(); closeGlobalProfileDropdown();">
              <span>Đổi mật khẩu</span>
            </button>
            <button type="button" class="profile-menu-item" onclick="openDiscordLinkModal(); closeGlobalProfileDropdown();">
              <span>Liên kết Discord</span>
            </button>
            <button id="globalRenewKeyBtn" type="button" class="profile-menu-item user-only" onclick="openRenewModal(); closeGlobalProfileDropdown();">
              <span>Gia hạn bằng mã Key</span>
            </button>
          </div>
        </div>
      </div>

  </header>
